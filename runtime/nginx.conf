worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 2k;
  client_body_timeout 5s;
  client_header_timeout 5s;
  keepalive_timeout 10s;
  send_timeout 30s;
  large_client_header_buffers 2 4k;

  limit_req_zone $binary_remote_addr zone=runtime_ingress:1m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=runtime_connections:1m;

  upstream structured_runtime {
    server unix:/run/runtime-public/public.sock;
    keepalive 8;
  }

  server {
    listen 3000;

    if ($http_transfer_encoding != "") {
      return 413;
    }

    location / {
      limit_req zone=runtime_ingress burst=20 nodelay;
      limit_conn runtime_connections 20;

      proxy_http_version 1.1;
      proxy_pass http://structured_runtime;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_set_header X-Real-IP "";
      proxy_request_buffering on;
      proxy_buffering on;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
      proxy_send_timeout 5s;
    }
  }
}
